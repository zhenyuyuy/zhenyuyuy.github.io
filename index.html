<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎀 每日清醒金句產生器 🎀</title>
<style>
body {
font-family: 'Microsoft JhengHei', sans-serif;
background-color: #fff0f5;
color: #333333;
display: flex;
justify-content: center;
align-items: center;
height: 100vh;
margin: 0;
transition: background-color 0.5s ease;
}

/* 販賣機外框 */
.vending-machine {
position: relative; /* 這裡很重要：為了讓蝴蝶結可以定位在邊緣 */
text-align: center;
background-color: #ffffff;
padding: 40px;
border-radius: 20px;
border: 3px solid #ffb6c1;
box-shadow: 0 10px 30px rgba(255, 182, 193, 0.3);
max-width: 450px;
width: 90%;
}

/* --- 新增：蝴蝶結裝飾的樣式 --- */
.bow-decoration {
position: absolute;
font-size: 2.5rem; /* 蝴蝶結的大小 */
top: -20px; /* 讓它突出一點點到框框外面 */
filter: drop-shadow(0 4px 6px rgba(255, 105, 180, 0.2)); /* 加上淡淡的粉紅陰影 */
}

.bow-left {
left: -15px; /* 放在左邊 */
transform: rotate(-15deg); /* 向左歪頭 */
}

.bow-right {
right: -15px; /* 放在右邊 */
transform: rotate(15deg); /* 向右歪頭 */
}
/* ------------------------------ */

h1 {
color: #ff69b4;
font-size: 2rem;
margin-bottom: 10px;
}

.subtitle {
color: #7f8c8d;
font-size: 0.9rem;
margin-bottom: 30px;
}

.screen {
background-color: #ffe4e1;
border-radius: 10px;
padding: 30px 20px;
font-size: 1.3rem;
min-height: 80px;
display: flex;
justify-content: center;
align-items: center;
line-height: 1.6;
color: #555555;
border-left: 5px solid #ff69b4;
margin-bottom: 30px;
}

button {
background-color: #ff85a2;
color: white;
border: none;
padding: 15px 40px;
font-size: 1.2rem;
font-weight: bold;
border-radius: 50px;
cursor: pointer;
box-shadow: 0 5px 15px rgba(255, 133, 162, 0.4);
transition: all 0.2s;
}

button:hover {
background-color: #ff69b4;
transform: translateY(-2px);
}

button:active {
transform: translateY(2px);
}
</style>
</head>
<body>

<div class="vending-machine">
<!-- 在卡片的左上角和右上角放入蝴蝶結 -->
<div class="bow-decoration bow-left">🎀</div>
<div class="bow-decoration bow-right">🎀</div>

<h1>🎀 今日清醒金句 🎀</h1>
<div class="subtitle">寫作業寫到懷疑人生？點擊按鈕獲取力量（或打擊）</div>

<div class="screen" id="quote-display">點擊下方按鈕，看看命運要對你說什麼...</div>

<button onclick="getQuote()">🎀 獲取今日金句</button>
</div>

<script>
const quotes = [
"萬事開頭難，中間難，結尾更難。",
"只要我沒有道德，就沒有人能綁架我。",
"遇到困難不要退縮，睡一覺起來，你會發現困難還在那裡。",
"不要被眼前的困難打敗，因為後面還有更多的困難。",
"我不是在摸魚，我是在幫公司測試網路穩定度。",
"別人都在努力，那你努力還有什麼用？",
"只要你肯吃苦，就會有吃不完的苦。",
"就算你是一坨屎，也會遇到一隻不嫌棄你的屎殼郎。但這並不值得高興。",
"有錢人終成眷屬，沒錢人親眼目睹。",
"今日事今日畢，如果沒畢，明天再說。"
];

const colors = [
"#fff0f5",
"#ffffff",
"#ffe4e1",
"#fff5f8",
"#ffebeb",
"#fafafa"
];

function getQuote() {
const randomQuoteIndex = Math.floor(Math.random() * quotes.length);
document.getElementById("quote-display").innerText = quotes[randomQuoteIndex];

const randomColorIndex = Math.floor(Math.random() * colors.length);
document.body.style.backgroundColor = colors[randomColorIndex];
}
</script>

</body>
</html>
